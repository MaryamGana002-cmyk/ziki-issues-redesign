<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ziki Issues</title>
    <meta name="description" content="Human–agent interaction redesigned Issues dashboard for Ziki with real-time issue reporting, agent delegation, and workflow automation." />
    <meta property="og:title" content="Ziki Issues" />
    <meta property="og:description" content="Human–agent interaction redesigned Issues dashboard for Ziki with real-time issue reporting, agent delegation, and workflow automation." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ziki-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0b1021] text-slate-900 dark:text-[#f3f4f6] antialiased selection:bg-blue-600 selection:text-white min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
